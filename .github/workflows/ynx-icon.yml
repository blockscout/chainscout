name: Add YNX icon

on:
  push:
    branches:
      - add-ynx-testnet-6423

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ynx-testnet-6423
      - name: Copy official YNX icon and update registry
        run: |
          curl -L --fail --retry 3 -o public/ynx-logo.png https://raw.githubusercontent.com/JiahaoAlbus/YNX-Chain-website/main/public/ynx-logo.png
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/chains.json')
          d=json.loads(p.read_text())
          d['6423']['logo']='/ynx-logo.png'
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False)+'\n')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ynx-icon.yml
          git config user.name "JiahaoAlbus"
          git config user.email "159010359+JiahaoAlbus@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add YNX chain icon"
          git push origin HEAD:add-ynx-testnet-6423
