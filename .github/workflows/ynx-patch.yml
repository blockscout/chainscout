name: Add YNX Testnet registry entry

on:
  push:
    branches:
      - add-ynx-testnet-6423

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ynx-testnet-6423
      - name: Add YNX Testnet to ChainScout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('data/chains.json')
          s = p.read_text()
          if '"6423"' not in s:
              entry = '''  "6423": {
    "name": "YNX Testnet",
    "description": "EVM-compatible public Layer 1 testnet for the YNX Web4 ecosystem.",
    "logo": "https://ipfs.io/ipfs/bafkreibydfqibqwvm5dpwnyjjk7gruoyt2v5rivstk2pc65ojcwh4px73y",
    "ecosystem": ["Ethereum", "EVM"],
    "isTestnet": true,
    "layer": 1,
    "rollupType": null,
    "native_currency": "YNXT",
    "website": "https://ynxweb4.com",
    "explorers": [
      {
        "url": "https://explorer.ynxweb4.com/",
        "hostedBy": "self"
      }
    ]
  },
'''
              if not s.startswith('{\n'):
                  raise SystemExit('unexpected chains.json format')
              s = '{\n' + entry + s[2:]
              p.write_text(s)
          json.loads(p.read_text())
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ynx-patch.yml
          git config user.name "JiahaoAlbus"
          git config user.email "159010359+JiahaoAlbus@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add YNX Testnet (6423)"
          git push origin HEAD:add-ynx-testnet-6423
